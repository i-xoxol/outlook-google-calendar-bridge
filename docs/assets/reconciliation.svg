    <text x="863" y="279" font-size="12" font-weight="700" letter-spacing="2" fill="#718378">REASON</text>
    <path d="M64 294H1320M64 357H1320M64 420H1320M64 483H1320M64 546H1320" stroke="#dce6df"/>
    <g font-size="18" fill="#29473a">
      <text x="75" y="334">Design review</text><text x="75" y="397">Focus session</text><text x="75" y="460">Quarterly planning</text><text x="75" y="523">Old appointment</text>
    </g>
    <g font-size="15" fill="#6b7d73">
      <text x="864" y="334">Title changed in Outlook</text><text x="864" y="397">Missing managed copy</text><text x="864" y="460">Already aligned</text><text x="864" y="523">Obsolete managed copy only</text>
    </g>
    <g font-size="12" font-weight="700" letter-spacing="1">
      <rect x="565" y="308" width="114" height="35" rx="17" fill="#e7eef3"/><text x="590" y="331" fill="#3a6e83">UPDATE</text>
