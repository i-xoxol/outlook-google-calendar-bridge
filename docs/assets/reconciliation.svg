<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">A fictional reconciliation preview</title>
  <desc id="desc">A fictional design review update, new focus session, unchanged planning event, and optional prune. A personal event is untouched. After simulated apply, the next plan has zero changes.</desc>
  <rect x="1" y="1" width="1398" height="638" rx="26" fill="#f7faf8" stroke="#d3e0d9"/>
  <g font-family="Segoe UI,Arial,sans-serif">
