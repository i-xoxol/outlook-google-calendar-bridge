      <text x="978" y="31" font-size="12" letter-spacing="2" fill="#6e7d74">PERSONAL EVENT</text><text x="978" y="67" font-size="21" font-weight="700" fill="#52695b">UNTOUCHED</text>
    </g>
    <text x="74" y="279" font-size="12" font-weight="700" letter-spacing="2" fill="#718378">EVENT</text>
