      <text x="24" y="31" font-size="12" letter-spacing="2" fill="#56766b">NEW COPY</text><text x="24" y="67" font-size="29" font-weight="700" fill="#244d40">1</text>
      <rect x="318" width="302" height="87" rx="12" fill="#e9f0f4"/>
      <text x="342" y="31" font-size="12" letter-spacing="2" fill="#5d7888">UPDATE</text><text x="342" y="67" font-size="29" font-weight="700" fill="#325d76">1</text>
