    <circle cx="83" cy="587" r="7" fill="#6ba580"/>
    <text x="105" y="593" font-size="18" font-weight="600" fill="#315d44">After simulated apply: next reconciliation has 0 changes.</text>
    <text x="995" y="593" font-size="13" fill="#829289">ILLUSTRATION · FICTIONAL EVENTS</text>
