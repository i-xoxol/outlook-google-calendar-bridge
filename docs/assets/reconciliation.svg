    <rect x="1165" y="49" width="166" height="42" rx="21" fill="#163c38"/>
    <text x="1201" y="76" font-size="14" font-weight="700" letter-spacing="2" fill="#d9efdf">DRY RUN</text>
    <g transform="translate(64 146)">
