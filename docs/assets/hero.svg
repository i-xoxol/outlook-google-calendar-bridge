<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Calendar Bridge</title>
  <desc id="desc">Your work calendar, where you plan your day. A self-hosted Outlook to Google Calendar service with preview, ownership, and verified session recovery.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e31"/><stop offset="1" stop-color="#17413f"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#91ddb8"/><stop offset="1" stop-color="#73c7c0"/></linearGradient>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1230" cy="65" r="210" fill="#8bd6b2" opacity=".035"/>
  <circle cx="1230" cy="65" r="150" fill="none" stroke="#8bd6b2" opacity=".08"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="72" y="83" font-size="15" font-weight="700" letter-spacing="4" fill="#99cab7">BUILT TO KEEP YOU IN SYNC</text>
    <text x="67" y="177" font-size="78" font-weight="700" letter-spacing="-3" fill="#fafcf6">Calendar Bridge</text>
    <text x="72" y="229" font-size="27" fill="#d6e5df">Your work calendar, where you plan your day.</text>
    <text x="72" y="289" font-size="20" fill="#a0bdb6">Read Outlook. Preview the difference. Update Google.</text>
    <text x="72" y="321" font-size="20" fill="#a0bdb6">Your accounts. Your service. Your decision to apply.</text>
    <g transform="translate(72 373)" font-size="13" font-weight="600" fill="#dcebe3">
      <rect width="171" height="39" rx="19" fill="#244b48"/><text x="21" y="25">MICROSOFT GRAPH</text>
      <rect x="183" width="173" height="39" rx="19" fill="#244b48"/><text x="204" y="25">GOOGLE CALENDAR</text>
      <rect x="368" width="136" height="39" rx="19" fill="#244b48"/><text x="389" y="25">SELF-HOSTED</text>
    </g>
    <text x="72" y="474" font-size="13" letter-spacing="1" fill="#719c92">PYTHON + OAUTH + SYSTEMD</text>
  </g>
  <g transform="translate(895 82)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="423" height="348" rx="22" fill="#203f3d" stroke="#47716a"/>
    <circle cx="30" cy="31" r="5" fill="#8ed7ae"/>
    <text x="46" y="37" font-size="13" fill="#c4dfd0" letter-spacing="1">PREVIEW BEFORE WRITING</text>
    <g transform="translate(29 73)">
      <text x="8" y="12" font-size="12" fill="#99b6b1" letter-spacing="1">OUTLOOK</text>
      <rect y="28" width="120" height="119" rx="13" fill="#173731" stroke="#527e72"/>
      <path d="M0 64H120" stroke="#527e72"/>
      <path d="M31 18V36M89 18V36" stroke="#9dd9ba" stroke-width="5" stroke-linecap="round"/>
      <rect x="18" y="80" width="83" height="13" rx="4" fill="#6cb4cc"/>
      <rect x="18" y="105" width="61" height="13" rx="4" fill="#355d56"/>
    </g>
    <path d="M177 158H248M238 149l10 9-10 9" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(273 73)">
      <text x="8" y="12" font-size="12" fill="#99b6b1" letter-spacing="1">GOOGLE</text>
      <rect y="28" width="120" height="119" rx="13" fill="#173731" stroke="#527e72"/>
      <path d="M0 64H120" stroke="#527e72"/>
      <path d="M31 18V36M89 18V36" stroke="#9dd9ba" stroke-width="5" stroke-linecap="round"/>
      <rect x="18" y="80" width="83" height="13" rx="4" fill="#8fd2ac"/>
      <rect x="18" y="105" width="61" height="13" rx="4" fill="#8fd2ac" opacity=".45"/>
    </g>
    <rect x="26" y="247" width="371" height="74" rx="12" fill="#173430"/>
    <text x="43" y="273" font-size="12" font-weight="700" letter-spacing="1" fill="#8dd1af">OWNED COPIES. CLEAR BOUNDARIES.</text>
    <text x="43" y="299" font-size="15" fill="#dfede4">No invitations. Personal events preserved.</text>
  </g>
